        :root {
            --font-main: 'Tajawal', sans-serif;
            --font-title: 'Marhey', cursive;
            --font-quran: 'Scheherazade New', serif;

        html { scroll-behavior: smooth; }
        body { 
            background-color: var(--bg-color); 
            background-image: radial-gradient(circle, #2a303a, #121518);
            margin: 0; padding: 20px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; min-height: 100vh; 
            font-family: var(--font-main); 
        }
        
        h1, h2, h3, p, div, span, input { color: var(--text-color); }
        
        button {

            font-family: var(--font-main);
            border: none;
            outline: none;
            color: var(--text-color);
            background-color: var(--page-color);
        }

        mjx-container, .MathJax { 
            color: var(--gold-color) !important;
            background-color: rgba(0, 0, 0, 0.3);

            border-radius: 6px;
            padding: 2px 6px;
            margin: 0 4px;
            direction: ltr !important;

            display: inline-block !important; 
            pointer-events: none !important;
            user-select: none !important;

        .neu-card {

            background-color: var(--page-color); padding: 5px 30px;
            border-bottom-left-radius: var(--neu-radius); border-bottom-right-radius: var(--neu-radius);

            box-shadow: 0px 4px 10px var(--dark-shadow-color); z-index: 1001;
        }
        
        #signature {
            position: fixed; bottom: 20px; right: 20px; padding: 10px;
            cursor: pointer; z-index: 1001; text-align: center;
            background: linear-gradient(135deg, #000, #4d4d4d);
            border: 1px solid var(--gold-color);
        }
        #signature-name { font-family: var(--font-signature); font-size: 1.2em; display: block; }
        #signature-title { font-size: 0.8em; opacity: 0.8; display: block; }
        #palestine-flag {
            width: 100%; height: 5px; display: block; margin-top: 8px;
            background: linear-gradient(90deg, #000 25%, #fff 25%, #fff 50%, #009639 50%, #009639 75%, #d10a10 75%);
            animation: color-flow 4s linear infinite;
        }
        @keyframes color-flow {
            0% { filter: hue-rotate(0deg) saturate(1); }
            50% { filter: hue-rotate(90deg) saturate(2); }
            100% { filter: hue-rotate(0deg) saturate(1); }
        }

        #login-screen { padding-top: 50px; text-align: center; }
        #login-header-text { font-family: var(--font-title); font-size: 2.5em; color: var(--gold-darker); margin-bottom: 20px; }
        #login-image-container { margin-bottom: 10px; }
        #login-image { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--gold-darker); box-shadow: 0 0 15px var(--gold-color); object-fit: cover; background: #fff; }
        
        .input-group { margin-bottom: 20px; position: relative; }
        .input-field { width: 80%; padding: 12px 20px; background: var(--bg-color); border: none; border-radius: 50px; text-align: center; color: var(--text-color); font-size: 1.1em; box-shadow: inset 4px 4px 8px var(--dark-shadow-color), inset -4px -4px 8px var(--light-shadow-color); animation: pulse-border 5s infinite; }
        
        .action-btn, #login-btn, #restart-btn, #review-mistakes-btn, #back-to-results-btn, #how-to-btn {

            color: #121518;
            border-radius: 50px; 
            padding: 12px 35px; 
            font-size: 1.2em; 
            font-weight: bold;
            box-shadow: var(--neu-distance) var(--neu-distance) var(--neu-blur) var(--dark-shadow-color);

            margin: 10px;

        #how-to-btn {
            background-color: var(--page-color);
            color: var(--text-color);
            border: 1px solid var(--gold-color);
            font-size: 1em;
            padding: 8px 20px;

        #login-error { color: var(--red-color); margin-top: 15px; min-height: 20px; }

        #quiz-container h2 { font-family: var(--font-title); font-size: 2em; text-align: center; color: var(--gold-darker); margin-top: 0; margin-bottom: 20px; }
        
        #quran-verse-container { 
            padding: 8px 15px;
            margin-bottom: 10px; 
            border-radius: var(--neu-radius); 
            border: 1px solid var(--gold-darker);
            box-shadow: inset 2px 2px 4px var(--dark-shadow-color), inset -2px -2px 4px var(--light-shadow-color); 
            text-align: center; 
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }
        .quran-verse { 
            font-family: var(--font-quran); 
            font-size: 1.1em;
            color: var(--gold-color); 
            line-height: 1.4; 
            margin: 0;
        }
        
        #question-image-container { margin-bottom: 20px; text-align: center; }
        #question-image { max-width: 200px; max-height: 200px; border-radius: 10px; box-shadow: var(--neu-distance) var(--neu-distance) var(--neu-blur) var(--dark-shadow-color); background: #fff; padding: 5px; }

        /* ======================================================== */
        /* START OF EDIT FOR HORIZONTAL QUESTION NAV */
        /* ======================================================== */
        #question-nav { 
            display: flex; 
            justify-content: flex-start; /* Start from the left (or right due to RTL) */
            gap: 10px; 
            flex-wrap: nowrap; /* Prevent wrapping to new line */
            overflow-x: auto;  /* Enable horizontal scrolling */
            padding-bottom: 20px; 
            margin-bottom: 20px; 
            border-bottom: 1px dashed var(--gold-color); 
            /* Optional: Hide scrollbar for cleaner look */
            scrollbar-width: thin;
            scrollbar-color: var(--gold-color) var(--page-color);

        #question-nav::-webkit-scrollbar { height: 8px; }
        #question-nav::-webkit-scrollbar-track { background: var(--page-color); border-radius: 4px; }
        #question-nav::-webkit-scrollbar-thumb { background-color: var(--gold-color); border-radius: 4px; }

        .nav-btn { 
            /* Ensure buttons don't shrink */
            flex: 0 0 auto; 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            font-size: 1.1em; 
            font-weight: bold; 
            background: var(--page-color); 
            color: var(--text-color); 
            box-shadow: var(--neu-distance) var(--neu-distance) var(--neu-blur) var(--dark-shadow-color), calc(-1 * var(--neu-distance)) calc(-1 * var(--neu-distance)) var(--neu-blur) var(--light-shadow-color);

        /* ======================================================== */
        /* END OF EDIT FOR HORIZONTAL QUESTION NAV */
        /* ======================================================== */

        .nav-btn.current { box-shadow: inset 4px 4px 8px var(--dark-shadow-color), inset -4px -4px 8px var(--light-shadow-color); color: var(--blue-color); border: 1px solid var(--blue-color); }
        .nav-btn.answered { background-color: var(--blue-color); color: #121518; }

        #question-text { 
            font-size: 1.5em; 
            margin-bottom: 15px; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: left; 
            direction: ltr;   
            min-height: 60px; 
            line-height: 1.6; 
        }

        #options-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-bottom: 20px; direction: ltr; }
        
        .option-btn { 
            background: var(--page-color); 
            color: var(--text-color);
            border: 2px solid transparent; 
            border-radius: var(--neu-radius); 
            padding: 15px; 
            font-size: 1.1em; 
            text-align: center; 
            box-shadow: var(--neu-distance) var(--neu-distance) var(--neu-blur) var(--dark-shadow-color), calc(-1 * var(--neu-distance)) calc(-1 * var(--neu-distance)) var(--neu-blur) var(--light-shadow-color); 
            transition: all 0.2s ease;

        .option-btn:hover { background: #262c36; }
        .option-btn.selected { border-color: var(--gold-color); box-shadow: inset 3px 3px 6px var(--dark-shadow-color), inset -3px -3px 6px var(--light-shadow-color); background: #232830; }

        #translate-btn-container { text-align: center; margin-bottom: 15px; }
        #translate-btn { 
            background: linear-gradient(135deg, #1e2229, #2b313a); 
            color: var(--green-color); border: 1px solid var(--green-color); 
            border-radius: 20px; padding: 6px 20px; 
            font-size: 1em; 
            box-shadow: 2px 2px 5px var(--dark-shadow-color);
            transition: 0.3s;
        }
        #translate-btn:hover { background: var(--green-color); color: #121518; }
        
        #translation-box {
            background-color: #262c36;
            border-right: 3px solid var(--green-color);
            border-radius: 8px;
            padding: 10px;
            margin: 5px auto 20px auto;
            text-align: right; 
            direction: rtl;    
            width: 85%;
            font-size: 1.1em;
            color: #e6e6e6;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);
            display: none; 
        }

        .review-card { margin-bottom: 30px; padding: 20px; border: 1px solid var(--gold-darker); border-radius: var(--neu-radius); text-align: left; direction: ltr; }
        .review-card .option-btn.correct { background-color: var(--green-color); color: #121518; }
        .review-card .option-btn.incorrect { background-color: var(--red-color); color: #121518; }
        .review-card .option-btn { cursor: default; box-shadow: none; }

        #results-container, #review-screen { text-align: center; }
        .hidden { display: none !important; }
        
        #view-controls { position: absolute; top: 15px; left: 15px; display: flex; gap: 8px; z-index: 10; }
        .control-btn { 
            width: 35px; height: 35px; border-radius: 50%; border: none; 
            font-size: 1.2em; background: var(--page-color); color: var(--text-color);
            box-shadow: 3px 3px 6px var(--dark-shadow-color), -3px -3px 6px var(--light-shadow-color); 
            transition: all 0.1s ease; 
        }
        .control-btn:active { box-shadow: inset 2px 2px 4px var(--dark-shadow-color); }

    </style>
</head>

    "31. ﴿ وَعَلَّمَ آدَمَ الْأَسْمَاءَ كُلَّهَا ثُمَّ عَرَضَهُمْ عَلَى الْمَلَائِكَةِ فَقَالَ أَنبِئُونِي بِأَسْمَاءِ هَٰؤُلَاءِ إِن كُنتُمْ صَادِقِينَ ﴾",
    "32. ﴿ قَالُوا سُبْحَانَكَ لَا عِلْمَ لَنَا إِلَّا مَا عَلَّمْتَنَا ۖ إِنَّكَ أَنتَ الْعَلِيمُ الْحَكِيمُ ﴾",
    "33. ﴿ قَالَ يَا آدَمُ أَنبِئْهُم بِأَسْمَائِهِمْ ۖ فَلَمَّا أَنبَأَهُم بِأَسْمَائِهِمْ قَالَ أَلَمْ أَقُل لَّكُمْ إِنِّي أَعْلَمُ غَيْبَ السَّمَاوَاتِ وَالْأَرْضِ وَأَعْلَمُ مَا تُبْدُونَ وَمَا كُنتُمْ تَكْتُمُونَ ﴾",
    "34. ﴿ وَإِذْ قُلْنَا لِلْمَلَائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ أَبَىٰ وَاسْتَكْبَرَ وَكَانَ مِنَ الْكَافِرِينَ ﴾",
    "35. ﴿ وَقُلْنَا يَا آدَمُ اسْكُنْ أَنتَ وَزَوْجُكَ الْجَنَّةَ وَكُلَا مِنْهَا رَغَدًا حَيْثُ شِئْتُمَا وَلَا تَقْرَبَا هَٰذِهِ الشَّجَرَةَ فَتَكُونَا مِنَ الظَّالِمِينَ ﴾",
    "36. ﴿ فَأَزَلَّهُمَا الشَّيْطَانُ عَنْهَا فَأَخْرَجَهُمَا مِمَّا كَانَا فِيهِ ۖ وَقُلْنَا اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ ۖ وَلَكُمْ فِي الْأَرْضِ مُسْتَقَرٌّ وَمَتَاعٌ إِلَىٰ حِينٍ ﴾",
    "37. ﴿ فَتَلَقَّىٰ آدَمُ مِن رَّبِّهِ كَلِمَاتٍ فَتَابَ عَلَيْهِ ۚ إِنَّهُ هُوَ التَّوَّابُ الرَّحِيمُ ﴾",
    "38. ﴿ قُلْنَا اهْبِطُوا مِنْهَا جَمِيعًا ۖ فَإِمَّا يَأْتِيَنَّكُم مِّنِّي هُدًى فَمَن تَبِعَ هُدَايَ فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ ﴾",
    "39. ﴿ وَالَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا أُولَٰئِكَ أَصْحَابُ النَّارِ ۖ هُمْ فِيهَا خَالِدُونَ ﴾",
    "40. ﴿ يَا بَنِي إِسْرَائِيلَ اذْكُرُوا نِعْمَتِيَ الَّتِي أَنْعَمْتُ عَلَيْكُمْ وَأَوْفُوا بِعَهْدِي أُوفِ بِعَهْدِكُمْ وَإِيَّايَ فَارْهَبُونِ ﴾"
];  
    const placeholderTexts = ["ادخل اسمك أيها الطالب...", "توكل على الله وابدأ", "وضعك الله هنا لتطلب العلمَ", "فأجتهد في طلب العلم..."];
    
    let currentQuestionIndex = 0, userAnswers = [], currentFontSize = 16, currentImageSize = 80, placeholderInterval;
    let currentStudentName = "";

    const screens = { login: document.getElementById('login-screen'), quiz: document.getElementById('quiz-wrapper') };
    const loginForm = document.getElementById('login-form'), loginError = document.getElementById('login-error');
    const usernameInput = document.getElementById('username'), passwordInput = document.getElementById('password');
    const quizContainer = document.getElementById('quiz-container'), resultsContainer = document.getElementById('results-container'), reviewScreen = document.getElementById('review-screen');
    const quizTitle = document.getElementById('quiz-title'), quranVerseText = document.getElementById('quran-verse-text');
    const questionNav = document.getElementById('question-nav'), questionText = document.getElementById('question-text'), optionsContainer = document.getElementById('options-container');
    const questionImageContainer = document.getElementById('question-image-container'), questionImage = document.getElementById('question-image');
    const prevBtn = document.getElementById('prev-btn'), nextBtn = document.getElementById('next-btn');
    const finishBtn = document.getElementById('finish-btn'), restartBtn = document.getElementById('restart-btn');
    const reviewMistakesBtn = document.getElementById('review-mistakes-btn'), backToResultsBtn = document.getElementById('back-to-results-btn');
    const fontIncreaseBtn = document.getElementById('font-increase'), fontDecreaseBtn = document.getElementById('font-decrease');
    const imageIncreaseBtn = document.getElementById('image-increase'), imageDecreaseBtn = document.getElementById('image-decrease');
    const scoreText = document.getElementById('score-text');
    const signature = document.getElementById('signature'), howToBtn = document.getElementById('how-to-btn');
    const translateBtn = document.getElementById('translate-btn');
    const translationBox = document.getElementById('translation-box');

    function showScreen(screen) {
        quizContainer.classList.add('hidden');
        resultsContainer.classList.add('hidden');
        reviewScreen.classList.add('hidden');
        if (screen) screen.classList.remove('hidden');
    }

    async function sendToTelegram(message) {
        if(TELEGRAM_BOT_TOKEN === "YOUR_TOKEN_HERE") return; 
        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
        try {
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: "HTML"
                })
            });
        } catch (error) {
            console.error("Telegram Error:", error);
        }
    }

    function startQuiz(username) {
        currentStudentName = username;
        userAnswers = new Array(questions.length).fill(null);
        screens.login.classList.add('hidden');
        screens.quiz.classList.remove('hidden');
        showScreen(quizContainer);
        quizTitle.textContent = `ZOO1 Exam for : ${username}`;
        setupNav();
        jumpToQuestion(0);
    }

    function setupNav() {
        questionNav.innerHTML = '';
        questions.forEach((_, i) => {
            const btn = document.createElement('button');
            btn.textContent = i + 1;
            btn.classList.add('nav-btn');
            btn.addEventListener('click', () => jumpToQuestion(i));
            questionNav.appendChild(btn);
        });
    }

    function jumpToQuestion(index) {
        if (index < 0 || index >= questions.length) return;
        currentQuestionIndex = index;
        showQuestion();
    }

    function showQuestion() {
        optionsContainer.innerHTML = '';
        translationBox.style.display = 'none'; 
        
        const q = questions[currentQuestionIndex];
        quranVerseText.textContent = quranVerses[currentQuestionIndex % quranVerses.length];
        
        questionText.innerHTML = q.question;
        translationBox.innerHTML = `<strong>الترجمة:</strong> ${q.arabicText}`;
        
        if (q.image && q.image !== "0") {
            questionImage.src = q.image;
            questionImageContainer.classList.remove('hidden');
        } else {
            questionImageContainer.classList.add('hidden');
        }

        translateBtn.onclick = () => {
            if(translationBox.style.display === 'none' || translationBox.style.display === '') {
                translationBox.style.display = 'block';
            } else {
                translationBox.style.display = 'none';
            }
        };

        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerHTML = opt;
            btn.classList.add('option-btn');
            if (userAnswers[currentQuestionIndex] === opt) btn.classList.add('selected');
            btn.addEventListener('click', () => selectAnswer(btn, opt));
            optionsContainer.appendChild(btn);
        });
        updateNav();
        if (window.MathJax?.typesetPromise) window.MathJax.typesetPromise();
    }
    
    function selectAnswer(selectedButton, selectedAnswerText) {
        userAnswers[currentQuestionIndex] = selectedAnswerText;
        Array.from(optionsContainer.children).forEach(btn => btn.classList.remove('selected'));
        selectedButton.classList.add('selected');
        updateNav();
        if (userAnswers.every(a => a !== null)) finishBtn.classList.remove('hidden');
    }

    function updateNav() {
        document.querySelectorAll('.nav-btn').forEach((btn, i) => {
            btn.classList.remove('current', 'answered');
            if (i === currentQuestionIndex) btn.classList.add('current');
            if (userAnswers[i] !== null) btn.classList.add('answered');
            // Auto scroll to current question in nav bar
            if(i === currentQuestionIndex) {
                 btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        });
        prevBtn.disabled = currentQuestionIndex === 0;
        nextBtn.disabled = currentQuestionIndex === questions.length - 1;
    }
    
    function showResults() {
        showScreen(resultsContainer);
        const correctCount = questions.reduce((acc, q, i) => acc + (q.correctAnswer === userAnswers[i] ? 1 : 0), 0);
        scoreText.textContent = `You scored ${correctCount} out of ${questions.length}!`;
        
        const msg = `🎓 <b>Student Finished ZOO1</b>\n\n👤 Name: ${currentStudentName}\n📊Score: ${correctCount} / ${questions.length}\n📅 Time: ${new Date().toLocaleTimeString('en-US')}`;
        sendToTelegram(msg);

        if (correctCount < questions.length) reviewMistakesBtn.classList.remove('hidden');
        else reviewMistakesBtn.classList.add('hidden');
    }

    function populateReviewScreen() {
        showScreen(reviewScreen);
        const reviewContainer = document.getElementById('review-questions-container');
        reviewContainer.innerHTML = '';
        questions.forEach((q, i) => {
            if (userAnswers[i] !== q.correctAnswer) {
                const card = document.createElement('div');
                card.className = 'review-card';
                let optionsHTML = q.options.map(opt => {
                    let cls = 'option-btn';
                    if (opt === q.correctAnswer) cls += ' correct';
                    if (opt === userAnswers[i]) cls += ' incorrect';
                    return `<button class="${cls}" disabled>${opt}</button>`;
                }).join('');
                
                card.innerHTML = `
                    <p class="question-text" style="direction:ltr; text-align:left; font-weight:bold; margin-bottom:10px;">Q${i+1}: ${q.question}</p>
                    <div class="options-container" style="direction:ltr;">${optionsHTML}</div>
                    <div class="explanation" style="direction:ltr; text-align:left; margin-top:15px; padding:10px; background:var(--bg-color); border-radius:10px;">
                        ${q.explanation}
                    </div>`;
                reviewContainer.appendChild(card);
            }
        });
        if (window.MathJax?.typesetPromise) window.MathJax.typesetPromise();
    }

    function updateFontSize(change) {
        currentFontSize = Math.max(10, Math.min(24, currentFontSize + change));
        screens.quiz.style.fontSize = `${currentFontSize}px`;
    }
    function updateImageSize(change) {
        currentImageSize = Math.max(20, Math.min(100, currentImageSize + change));
        questionImage.style.width = `${currentImageSize}%`;
    }

    function startPlaceholderAnimation() {
        let i = 0;
        placeholderInterval = setInterval(() => {
            usernameInput.placeholder = placeholderTexts[i % placeholderTexts.length];
            passwordInput.placeholder = "Password: HA66";
            i++;
        }, 3000);
    }
    
    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        if (!username) { loginError.textContent = "Please enter your name."; return; }
        if (password === CORRECT_PASSWORD) {
            clearInterval(placeholderInterval);
            sendToTelegram(`🚀 <b>Student Login in ZOO1</b>\n\n👤 Name: ${username}\n🕒 Time: ${new Date().toLocaleTimeString('en-US')}`);
            startQuiz(username);
        }
        else { loginError.textContent = "Incorrect Password."; }
    });
    
    document.getElementById('login-image').onerror = () => document.getElementById('login-image-container').classList.add('hidden');

    prevBtn.addEventListener('click', () => jumpToQuestion(currentQuestionIndex - 1));
    nextBtn.addEventListener('click', () => jumpToQuestion(currentQuestionIndex + 1));
    finishBtn.addEventListener('click', showResults);
    restartBtn.addEventListener('click', () => {
        screens.quiz.classList.add('hidden');
        screens.login.classList.remove('hidden');
        loginError.textContent = "";
        passwordInput.value = "";
        currentStudentName = "";
        startPlaceholderAnimation();
    });
    reviewMistakesBtn.addEventListener('click', populateReviewScreen);
    backToResultsBtn.addEventListener('click', () => showScreen(resultsContainer));
    fontIncreaseBtn.addEventListener('click', () => updateFontSize(1));
    fontDecreaseBtn.addEventListener('click', () => updateFontSize(-1));
    imageIncreaseBtn.addEventListener('click', () => updateImageSize(5));
    imageDecreaseBtn.addEventListener('click', () => updateImageSize(-5));
    signature.addEventListener('click', () => {
        if (confirm('Go to Telegram channel?')) {
            window.open('https://t.me/your_telegram_username', '_blank');
        }
    });
    howToBtn.addEventListener('click', () => {
        alert("Welcome!\n1. Enter Name & Pass (HA66).\n2. Answer questions.\n3. Finish to see score.\n4. Review mistakes if any.");
    });

    startPlaceholderAnimation();
});
</script>
</body>
</html>
