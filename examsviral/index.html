<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الامتحانات المتوفرة</title>
    <!-- خط تجوال -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة أيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --bg-color: #e2e8f0; /* لون خلفية الشاشة الكبيرة */
            --app-bg: #f8fafc; /* لون خلفية التطبيق */
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center; /* توسيط التطبيق في الشاشة */
            align-items: flex-start;
            min-height: 100vh;
        }

        /* حاوية التطبيق الثابتة بعرض 450 */
        .container {
            width: 360px;
            min-height: 100vh;
            background-color: var(--app-bg);
            padding: 5px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow-x: hidden;
        }

        /* تنسيق الهيدر المطور */
        header {
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            color: white;
            padding: 25px 15px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 900;
        }

        /* تنسيق الدعاء */
        .prayer-box {
            background-color: rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 10px;
            margin: 15px auto 10px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .prayer-box h3 {
            font-size: 1rem;
            line-height: 1.5;
            color: #fff;
        }

        /* أدوات التحكم (البحث والفلاتر) */
        .controls {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-wrapper i {
            position: absolute;
            right: 15px; 
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }

        .search-wrapper input {
            padding-right: 40px; 
            padding-left: 10px;
        }

        .filters-row {
            display: flex;
            gap: 10px;
        }

        .filter-box {
            flex: 1;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: 0.3s;
            background-color: #f9fafb;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* البطاقات (بطاقتين في الصف) */
        .exams-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px;
            padding-bottom: 20px;
        }

        .exam-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 18px 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.04);
            transition: all 0.3s ease;
            border: 1px solid #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center; 
            text-align: center;
            position: relative;
        }

        .exam-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            border-color: var(--primary-color);
        }

        .icon-box {
            width: 50px;
            height: 50px;
            background-color: #eff6ff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            font-size: 1.4rem;
            margin-bottom: 12px;
        }

        .exam-info h3 {
            color: #111827;
            font-size: 1rem;
            margin-bottom: 10px;
            line-height: 1.4;
            min-height: 42px; 
        }

        .badges {
            display: flex;
            flex-direction: column; 
            gap: 6px;
            margin-bottom: 15px;
            width: 100%;
        }

        .badge {
            font-size: 0.75rem;
            padding: 5px 3px;
            border-radius: 5px;
            background-color: #f3f4f6;
            color: #4b5563;
            width: 100%;
        }

        .btn-open {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-open:hover {
            background-color: var(--secondary-color);
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 10px;
            color: #9ca3af;
            background: #fff;
            border-radius: 12px;
            font-size: 1rem;
        }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fas fa-graduation-cap"></i> الامتحانات المتوفرة</h1>
        
        <div class="prayer-box">
            <h3>دعواتكم بعمرةٍ مع من نحب.. فبها ننجو ❤️</h3>
        </div>
    </header>

    <!-- أدوات التحكم -->
    <div class="controls">
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن اسم المادة...">
        </div>
        
        <div class="filters-row">
            <div class="filter-box">
                <select id="facultyFilter">
                    <option value="all">كل الكليات</option>
                </select>
            </div>
            <div class="filter-box">
                <select id="levelFilter">
                    <option value="all">كل الفرق</option>
                </select>
            </div>
        </div>
    </div>

    <!-- عرض النتائج -->
    <div id="examsContainer" class="exams-grid"></div>
</div>

<script>
    // ==========================================
    // 1. البيانات
    // ==========================================
    const examsData = [
        { name: "زولوجي 1 (تحدي برمجة)", faculty: "علوم", level: "الأولى", file: "1SCI/ZOO.html" },
        { name: "بوتاني 1", faculty: "علوم", level: "الأولى", file: "1SCI/Botany1.html" },
        { name: "كيمياء 1 (عام)", faculty: "علوم", level: "الأولى", file: "1SCI/chemeic.html" },
        { name: "كيمياء 1 (2021)", faculty: "علوم", level: "الأولى", file: "1SCI/chemeic2021.html" },
        { name: "كيمياء 1 (2023)", faculty: "علوم", level: "الأولى", file: "1SCI/chemeic2023.html" },
        { name: "English 1", faculty: "علوم", level: "الأولى", file: "1SCI/english1.html" },
        { name: "رياضيات 1 (2024)", faculty: "علوم", level: "الأولى", file: "1SCI/math2024.html" },
        { name: "زولوجي 1 (2024)", faculty: "علوم", level: "الأولى", file: "1SCI/ZOO2024.html" },
        { name: "زولوجي 1 (2023)", faculty: "علوم", level: "الأولى", file: "1SCI/ZOO2023.html" },
        { name: "زولوجي 1 (ترم 2)", faculty: "علوم", level: "الأولى", file: "1SCI/ZOO2023SECONDTerm.html" }
    ];

    const container = document.getElementById('examsContainer');
    const searchInput = document.getElementById('searchInput');
    const facultyFilter = document.getElementById('facultyFilter');
    const levelFilter = document.getElementById('levelFilter');

    function normalizeArabic(text) {
        return text.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي');
    }

    function populateFilters() {
        const faculties = [...new Set(examsData.map(item => item.faculty))];
        faculties.forEach(fac => {
            const option = document.createElement('option');
            option.value = fac;
            option.textContent = fac;
            facultyFilter.appendChild(option);
        });

        const levels = [...new Set(examsData.map(item => item.level))];
        levels.sort();
        levels.forEach(lvl => {
            const option = document.createElement('option');
            option.value = lvl;
            option.textContent = lvl;
            levelFilter.appendChild(option);
        });
    }

    function displayExams(data) {
        container.innerHTML = '';

        if (data.length === 0) {
            container.innerHTML = `
                <div class="no-results">
                    <i class="fas fa-folder-open" style="font-size: 2.5rem; margin-bottom: 10px;"></i>
                    <p>لا توجد امتحانات تطابق بحثك</p>
                </div>`;
            return;
        }

        data.forEach(exam => {
            const card = document.createElement('div');
            card.className = 'exam-card';
            
            let iconClass = 'fa-file-lines';
            if(exam.name.includes('كيمياء')) iconClass = 'fa-flask';
            if(exam.name.includes('زولوجي') || exam.name.includes('بوتاني')) iconClass = 'fa-leaf';
            if(exam.name.includes('رياضيات')) iconClass = 'fa-calculator';
            if(exam.name.includes('English')) iconClass = 'fa-language';

            card.innerHTML = `
                <div class="icon-box">
                    <i class="fas ${iconClass}"></i>
                </div>
                <div class="exam-info">
                    <h3>${exam.name}</h3>
                    <div class="badges">
                        <span class="badge"><i class="fas fa-university"></i> ${exam.faculty}</span>
                        <span class="badge"><i class="fas fa-user-graduate"></i> الفرقة ${exam.level}</span>
                    </div>
                </div>
                <a href="${exam.file}" class="btn-open">
                    فتح <i class="fas fa-arrow-left"></i>
                </a>
            `;
            container.appendChild(card);
        });
    }

    function filterData() {
        const rawSearchText = searchInput.value.toLowerCase();
        const searchText = normalizeArabic(rawSearchText);
        const selectedFaculty = facultyFilter.value;
        const selectedLevel = levelFilter.value;

        const filtered = examsData.filter(exam => {
            const normalizedName = normalizeArabic(exam.name.toLowerCase());
            const matchName = normalizedName.includes(searchText);
            const matchFaculty = selectedFaculty === 'all' || exam.faculty === selectedFaculty;
            const matchLevel = selectedLevel === 'all' || exam.level === selectedLevel;
            return matchName && matchFaculty && matchLevel;
        });

        displayExams(filtered);
    }

    searchInput.addEventListener('input', filterData);
    facultyFilter.addEventListener('change', filterData);
    levelFilter.addEventListener('change', filterData);

    populateFilters();
    displayExams(examsData);

</script>

</body>
</html>
