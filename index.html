<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=400, user-scalable=no">
    <title>آيات بينات</title>
    
    <!-- الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Amiri:wght@700&family=Readex+Pro:wght@400;700&display=swap" rel="stylesheet">
    <!-- الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #e0e5ec;
            --light-shadow: #ffffff;
            --dark-shadow: #a3b1c6;
            --text-color: #5b6574;
            --primary-accent: #ff6b81;
            --highlight-color: #ffd700;
            --telegram-color: #2AABEE;
            --teacher-color: #6c5ce7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: #cfd8e3;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #app-wrapper {
            width: 400px;
            background-color: var(--bg-color);
            position: relative;
            min-height: 100vh;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }

        /* ================= Splash Header ================= */
        #splash-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            z-index: 1000;
            transition: all 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        #splash-container.move-up {
            top: 60px;
            transform: translate(-50%, 0) scale(0.8);
        }

        .brand-title {
            font-family: 'Amiri', serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--text-color);
            display: inline-block;
            position: relative;
        }

        .brand-title.highlighted {
            animation: highlight-wipe 0.8s ease-out forwards;
        }

        @keyframes highlight-wipe {
            0% { background: linear-gradient(90deg, transparent 50%, var(--highlight-color) 50%); background-size: 200% 100%; background-position: right; -webkit-background-clip: text; }
            100% { background: linear-gradient(90deg, transparent 50%, var(--highlight-color) 50%); background-size: 200% 100%; background-position: left; color: #000;}
        }

        #heart-anim { width: 100px; height: 100px; margin: 10px auto; opacity: 0; transition: 0.5s; }
        #heart-anim.show { opacity: 1; }
        .heart-path { fill: none; stroke: var(--primary-accent); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 200; stroke-dashoffset: 200; }
        .show .heart-path { animation: draw 1.5s ease-out forwards; }
        @keyframes draw { to { stroke-dashoffset: 0; fill: rgba(255, 107, 129, 0.1); } }
        .move-up #heart-anim { opacity: 0; height: 0; margin: 0; }

        /* ================= Main Content ================= */
        #main-content {
            padding: 140px 20px 40px;
            opacity: 0;
            transform: translateY(30px);
            transition: 1s ease-out;
            pointer-events: none;
        }

        #main-content.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

        .header-card {
            width: 100%;
            padding: 20px;
            border-radius: 20px;
            background: var(--bg-color);
            box-shadow: 8px 8px 16px var(--dark-shadow), -8px -8px 16px var(--light-shadow);
            text-align: center;
            margin-bottom: 25px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .neu-card {
            background: var(--bg-color);
            border-radius: 25px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 7px 7px 14px var(--dark-shadow), -7px -7px 14px var(--light-shadow);
            transition: 0.3s;
            cursor: pointer;
            border: none;
        }

        .neu-card:active {
            box-shadow: inset 5px 5px 10px var(--dark-shadow), inset -5px -5px 10px var(--light-shadow);
            transform: scale(0.96);
        }

        .card-icon { font-size: 2rem; margin-bottom: 10px; }
        .neu-card h2 { font-size: 0.9rem; font-weight: 700; }

        .telegram .card-icon { color: var(--telegram-color); }
        .exams .card-icon { color: #ff9f43; }
        .youtube .card-icon { color: #ee5253; }
        .books .card-icon { color: #1dd1a1; }
        
        .teacher-login-card {
            grid-column: span 2;
            margin-top: 10px;
            background: linear-gradient(145deg, #e6e9f0, #ffffff);
            border: 1px solid rgba(108, 92, 231, 0.1);
        }
        .teacher-login-card .card-icon { color: var(--teacher-color); }

        /* ================= Dialog / Modal ================= */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .modal-box {
            width: 320px;
            background: var(--bg-color);
            padding: 25px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 15px 15px 30px #bebebe, -15px -15px 30px #ffffff;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-box h3 { margin-bottom: 15px; color: var(--telegram-color); }
        
        .copy-area {
            background: #d1d9e6;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            margin-bottom: 20px;
            word-break: break-all;
            box-shadow: inset 2px 2px 5px var(--dark-shadow);
        }

        .modal-btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            background: var(--bg-color);
            box-shadow: 4px 4px 8px var(--dark-shadow), -4px -4px 8px var(--light-shadow);
            color: var(--text-color);
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }

        .modal-btn:active { box-shadow: inset 2px 2px 5px var(--dark-shadow); }
        .btn-copy { color: var(--telegram-color); }
    </style>
</head>
<body>

    <div id="app-wrapper">
        
        <div id="splash-container">
            <h1 class="brand-title" id="brand-name">آيات بينات</h1>
            <div id="heart-anim">
                <svg viewBox="0 0 100 100">
                    <path class="heart-path" d="M 50,30 C 50,30 40,10 20,10 C 0,10 0,40 0,40 C 0,60 50,90 50,90 C 50,90 100,60 100,40 C 100,40 100,10 80,10 C 60,10 50,30 50,30 Z"></path>
                </svg>
            </div>
        </div>

        <div id="main-content">
            <div class="header-card">
                <div style="color: var(--primary-accent); font-weight: 900; margin-bottom: 5px;">صَلِّ عَلَى مُحَمَّدٍﷺ</div>
                <p style="font-size: 0.85rem; font-weight: 700;">منصة آيات بينات التعليمية لتبسيط العلوم</p>
            </div>

            <div class="grid-container">
                <!-- رابط صفحة الامتحانات في مجلد فرعي -->
                <a href="examsviral/index.html" class="neu-card exams">
                    <i class="fas fa-file-signature card-icon"></i>
                    <h2>الامتحانات</h2>
                </a>

                <!-- زر التليجرام مع وظيفة النسخ -->
                <button class="neu-card telegram" onclick="handleTelegram()">
                    <i class="fab fa-telegram-plane card-icon"></i>
                    <h2>قناتنا</h2>
                </button>

                <a href="#" class="neu-card youtube">
                    <i class="fab fa-youtube card-icon"></i>
                    <h2>المحاضرات</h2>
                </a>

                <a href="#" class="neu-card books">
                    <i class="fas fa-book-open card-icon"></i>
                    <h2>المذكرات</h2>
                </a>

                <!-- قسم دخول المعلمين (للتطوير لاحقاً) -->
                <button class="neu-card teacher-login-card" onclick="alert('قسم دخول المعلمين قيد التطوير حالياً')">
                    <i class="fas fa-user-tie card-icon"></i>
                    <h2>دخول المعلمين (Teacher Login)</h2>
                </button>
            </div>
        </div>
    </div>

    <!-- نافذة التليجرام -->
    <div id="modal-overlay">
        <div class="modal-box">
            <h3>قناة التليجرام</h3>
            <p style="font-size: 0.9rem; margin-bottom: 10px;">تم فتح الرابط في نافذة جديدة.</p>
            <div class="copy-area" id="link-text">https://t.me/SCI_students</div>
            <button class="modal-btn btn-copy" onclick="copyLink()">نسخ الرابط <i class="fas fa-copy"></i></button>
            <button class="modal-btn" onclick="closeModal()">إغلاق</button>
        </div>
    </div>

    <script>
        // أنيميشن البداية
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => document.getElementById('brand-name').classList.add('highlighted'), 600);
            setTimeout(() => document.getElementById('heart-anim').classList.add('show'), 1200);
            setTimeout(() => {
                document.getElementById('splash-container').classList.add('move-up');
                document.getElementById('main-content').classList.add('visible');
            }, 3500);
        });

        // وظائف التليجرام
        function handleTelegram() {
            // فتح الرابط
            window.open('https://t.me/SCI_students', '_blank');
            // إظهار نافذة النسخ
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        function copyLink() {
            const link = document.getElementById('link-text').innerText;
            navigator.clipboard.writeText(link).then(() => {
                alert('تم نسخ الرابط إلى الحافظة!');
            });
        }
    </script>
</body>
</html>
