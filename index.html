<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=400, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>آيات بينات</title>

    <!-- الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Amiri:wght@700&family=Readex+Pro:wght@400;700&display=swap" rel="stylesheet">
    <!-- الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ================= إعدادات أساسية ================= */
        :root {
            --bg-color: #e0e5ec;
            --light-shadow: #ffffff;
            --dark-shadow: #a3b1c6;
            --text-color: #5b6574;
            --primary-accent: #ff6b81; /* لون القلب */
            --highlight-color: #ffd700; /* لون التظليل */
            --telegram-color: #2AABEE; /* لون تليجرام */
            --card-radius: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #cfd8e3; /* خلفية أغمق قليلاً خارج التطبيق */
            font-family: 'Tajawal', sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        /* حاوية التطبيق (شاشة الهاتف - 400px) */
        #app-container {
            width: 400px;
            min-height: 100vh;
            background-color: var(--bg-color);
            position: relative;
            overflow-x: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
        }

        /* ================= شاشة البداية وحركة العنوان ================= */
        #animated-header {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            z-index: 100;
            transition: all 1s cubic-bezier(0.25, 0.8, 0.25, 1); /* حركة سلسة للأعلى */
        }

        /* عندما يتحرك العنوان للأعلى */
        #animated-header.move-up {
            top: 40px;
            transform: translate(-50%, 0) scale(0.85); /* يصغر حجمه قليلاً في الأعلى */
        }

        .brand-title {
            font-family: 'Amiri', serif;
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-color);
            position: relative;
            padding: 5px 10px;
            display: inline-block;
        }

        /* تأثير التظليل الأصفر */
        .brand-title.highlighted {
            animation: highlight-wipe 0.8s ease-out forwards;
        }

        @keyframes highlight-wipe {
            0% { background: linear-gradient(90deg, transparent 50%, var(--highlight-color) 50%); background-size: 200% 100%; background-position: right; -webkit-background-clip: text; }
            100% { background: linear-gradient(90deg, transparent 50%, var(--highlight-color) 50%); background-size: 200% 100%; background-position: left; color: #000;}
        }

        /* أنيميشن القلب */
        #heart-animation {
            width: 100px;
            height: 100px;
            margin: 10px auto 0;
            opacity: 0;
            transition: opacity 0.5s ease-in, transform 0.5s;
            transform: scale(0.5);
        }

        #heart-animation.show {
            opacity: 1;
            transform: scale(1);
        }

        /* إخفاء القلب بعد الصعود */
        #animated-header.move-up #heart-animation {
            opacity: 0;
            transform: scale(0);
            height: 0;
            margin: 0;
        }

        #heart-animation svg { width: 100%; height: 100%; overflow: visible; }
        .heart-path {
            fill: none;
            stroke: var(--primary-accent);
            stroke-width: 5;
            stroke-linecap: round;
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
        }
        #heart-animation.show .heart-path {
            animation: drawHeart 1.5s ease-out forwards;
        }
        @keyframes drawHeart { to { stroke-dashoffset: 0; fill: rgba(255, 107, 129, 0.2); } }

        /* ================= المحتوى الرئيسي ================= */
        #main-content {
            padding: 120px 20px 30px; /* مسافة علوية لترك مكان للعنوان */
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
            transition: all 0.8s ease-out;
            transition-delay: 0.3s;
        }

        #main-content.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        /* البطاقة العلوية (الدعاء / النص) */
        .header-card {
            width: 100%;
            padding: 20px;
            border-radius: var(--card-radius);
            background: var(--bg-color);
            box-shadow: 8px 8px 16px var(--dark-shadow), -8px -8px 16px var(--light-shadow);
            text-align: center;
            margin-bottom: 25px;
        }

        .header-card .salah {
            font-family: 'Amiri', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-accent);
            margin-bottom: 10px;
        }

        .header-card p {
            font-size: 0.95rem;
            line-height: 1.6;
            font-weight: 700;
        }

        /* شبكة البطاقات (2 في كل صف) */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        /* تصميم البطاقات العامة */
        .card {
            background: var(--bg-color);
            border-radius: var(--card-radius);
            padding: 20px 10px;
            box-shadow: 6px 6px 12px var(--dark-shadow), -6px -6px 12px var(--light-shadow);
            text-decoration: none;
            color: var(--text-color);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 8px 8px 15px var(--dark-shadow), -8px -8px 15px var(--light-shadow);
        }

        .card:active {
            box-shadow: inset 5px 5px 10px var(--dark-shadow), inset -5px -5px 10px var(--light-shadow);
            transform: translateY(0);
        }

        .card-icon {
            font-size: 2.2rem;
            margin-bottom: 12px;
            color: var(--text-color);
            transition: color 0.3s;
        }

        .card h2 {
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Readex Pro', sans-serif;
        }

        /* تلوين أيقونات معينة عند المرور عليها */
        .telegram-card:hover .card-icon, .telegram-card:hover h2 { color: var(--telegram-color); }
        .exam-card:hover .card-icon, .exam-card:hover h2 { color: #ff9f43; }
        .youtube-card:hover .card-icon, .youtube-card:hover h2 { color: #ee5253; }
        .books-card:hover .card-icon, .books-card:hover h2 { color: #1dd1a1; }

    </style>
</head>
<body>

    <!-- حاوية التطبيق الثابتة بعرض 400px -->
    <div id="app-container">
        
        <!-- الهيدر المتحرك (آيات بينات + القلب) -->
        <div id="animated-header">
            <h1 class="brand-title" id="brand-text">آيات بينات</h1>
            
            <div id="heart-animation">
                <!-- رسمة القلب SVG -->
                <svg viewBox="0 0 100 100">
                    <path class="heart-path" d="M 50,30 C 50,30 40,10 20,10 C 0,10 0,40 0,40 C 0,60 50,90 50,90 C 50,90 100,60 100,40 C 100,40 100,10 80,10 C 60,10 50,30 50,30 Z"></path>
                </svg>
            </div>
        </div>

        <!-- المحتوى الرئيسي (يظهر بعد صعود الهيدر) -->
        <div id="main-content">
            
            <!-- رسالة / دعاء علوي -->
            <div class="header-card">
                <div class="salah">صَلِّ عَلَى مُحَمَّدٍﷺ</div>
                <p>منصة تعليمية تهدف لتبسيط العلوم وتقديم محتوى أكاديمي متميز.</p>
            </div>

            <!-- شبكة البطاقات (2 في الصف) -->
            <div class="cards-grid">
                
                <!-- بطاقة الامتحانات -->
                <a href="#" class="card exam-card">
                    <i class="fas fa-laptop-code card-icon"></i>
                    <h2>الامتحانات</h2>
                </a>

                <!-- بطاقة تليجرام -->
                <a href="#" class="card telegram-card">
                    <i class="fab fa-telegram-plane card-icon"></i>
                    <h2>قناتنا</h2>
                </a>

                <!-- بطاقة المحاضرات -->
                <a href="#" class="card youtube-card">
                    <i class="fab fa-youtube card-icon"></i>
                    <h2>المحاضرات</h2>
                </a>

                <!-- بطاقة المذكرات -->
                <a href="#" class="card books-card">
                    <i class="fas fa-book-open card-icon"></i>
                    <h2>المذكرات</h2>
                </a>

            </div>

        </div>

    </div>

    <!-- كود الجافاسكربت لتنظيم الحركات -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const brandText = document.getElementById('brand-text');
            const heartAnim = document.getElementById('heart-animation');
            const header = document.getElementById('animated-header');
            const mainContent = document.getElementById('main-content');

            // 1. تظليل النص باللون الأصفر بعد نصف ثانية
            setTimeout(() => {
                brandText.classList.add('highlighted');
            }, 500);

            // 2. إظهار رسمة القلب بعد ثانية
            setTimeout(() => {
                heartAnim.classList.add('show');
            }, 1000);

            // 3. رفع العنوان للأعلى وإظهار المحتوى بعد اكتمال رسم القلب (3.5 ثواني)
            setTimeout(() => {
                header.classList.add('move-up'); // رفع العنوان وإخفاء القلب
                mainContent.classList.add('visible'); // إظهار البطاقات
            }, 3500);
        });
    </script>
</body>
</html>
