<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=400, user-scalable=no">
    <title>آيات بينات</title>
    
    <!-- الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Amiri:wght@700&family=Readex+Pro:wght@400;700&display=swap" rel="stylesheet">
    <!-- الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #e0e5ec;
            --light-shadow: #ffffff;
            --dark-shadow: #a3b1c6;
            --text-color: #5b6574;
            --primary-accent: #ff6b81;
            --highlight-color: #ffd700;
            --telegram-color: #2AABEE;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: #cfd8e3; /* خلفية المحيط */
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* حاوية التطبيق الثابتة */
        #app-wrapper {
            width: 400px;
            background-color: var(--bg-color);
            position: relative;
            min-height: 100vh;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }

        /* ================= شاشة التحميل والشعار المتحرك ================= */
        #splash-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            z-index: 1000;
            transition: all 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        /* وضعية العنوان بعد الانتهاء (الهيدر) */
        #splash-container.move-up {
            top: 60px;
            transform: translate(-50%, 0) scale(0.8);
        }

        .brand-title {
            font-family: 'Amiri', serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--text-color);
            display: inline-block;
            position: relative;
            padding: 0 10px;
        }

        .brand-title.highlighted {
            animation: highlight-wipe 0.8s ease-out forwards;
        }

        @keyframes highlight-wipe {
            0% { background: linear-gradient(90deg, transparent 50%, var(--highlight-color) 50%); background-size: 200% 100%; background-position: right; -webkit-background-clip: text; }
            100% { background: linear-gradient(90deg, transparent 50%, var(--highlight-color) 50%); background-size: 200% 100%; background-position: left; color: #000;}
        }

        #heart-anim {
            width: 100px;
            height: 100px;
            margin: 10px auto;
            opacity: 0;
            transition: 0.5s;
        }

        #heart-anim.show { opacity: 1; }
        #heart-anim svg { width: 100%; height: 100%; }

        .heart-path {
            fill: none;
            stroke: var(--primary-accent);
            stroke-width: 5;
            stroke-linecap: round;
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
        }

        .show .heart-path {
            animation: draw 1.5s ease-out forwards;
        }

        @keyframes draw { to { stroke-dashoffset: 0; fill: rgba(255, 107, 129, 0.1); } }

        /* إخفاء القلب عند صعود العنوان */
        .move-up #heart-anim {
            opacity: 0;
            height: 0;
            margin: 0;
        }

        /* ================= المحتوى الرئيسي ================= */
        #main-content {
            padding: 140px 20px 40px;
            opacity: 0;
            transform: translateY(30px);
            transition: 1s ease-out;
            pointer-events: none;
        }

        #main-content.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* البطاقة العلوية (الدعاء) */
        .header-card {
            width: 100%;
            padding: 20px;
            border-radius: 20px;
            background: var(--bg-color);
            box-shadow: 8px 8px 16px var(--dark-shadow), -8px -8px 16px var(--light-shadow);
            text-align: center;
            margin-bottom: 30px;
        }

        .salah-text {
            font-family: 'Amiri', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-accent);
            margin-bottom: 10px;
        }

        /* شبكة البطاقات (2 في كل صف) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .neu-card {
            background: var(--bg-color);
            border-radius: 25px;
            padding: 25px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 7px 7px 14px var(--dark-shadow), -7px -7px 14px var(--light-shadow);
            transition: 0.3s;
        }

        .neu-card:active {
            box-shadow: inset 5px 5px 10px var(--dark-shadow), inset -5px -5px 10px var(--light-shadow);
            transform: scale(0.96);
        }

        .card-icon {
            font-size: 2.2rem;
            margin-bottom: 12px;
            color: var(--text-color);
        }

        .neu-card h2 {
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Readex Pro', sans-serif;
        }

        /* تلوين الأيقونات حسب النوع */
        .telegram .card-icon { color: var(--telegram-color); }
        .exams .card-icon { color: #ff9f43; }
        .youtube .card-icon { color: #ee5253; }
        .books .card-icon { color: #1dd1a1; }

    </style>
</head>
<body>

    <div id="app-wrapper">
        
        <!-- القسم المتحرك (Splash to Header) -->
        <div id="splash-container">
            <h1 class="brand-title" id="brand-name">آيات بينات</h1>
            <div id="heart-anim">
                <svg viewBox="0 0 100 100">
                    <path class="heart-path" d="M 50,30 C 50,30 40,10 20,10 C 0,10 0,40 0,40 C 0,60 50,90 50,90 C 50,90 100,60 100,40 C 100,40 100,10 80,10 C 60,10 50,30 50,30 Z"></path>
                </svg>
            </div>
        </div>

        <!-- المحتوى الرئيسي -->
        <div id="main-content">
            
            <div class="header-card">
                <div class="salah-text">صَلِّ عَلَى مُحَمَّدٍﷺ</div>
                <p style="font-size: 0.9rem; font-weight: 700; line-height: 1.6;">
                    منصة آيات بينات التعليمية لتبسيط العلوم الأكاديمية ونشر المعرفة.
                </p>
            </div>

            <div class="grid-container">
                
                <a href="#" class="neu-card exams">
                    <i class="fas fa-file-signature card-icon"></i>
                    <h2>الامتحانات</h2>
                </a>

                <a href="#" class="neu-card telegram">
                    <i class="fab fa-telegram-plane card-icon"></i>
                    <h2>قناتنا</h2>
                </a>

                <a href="#" class="neu-card youtube">
                    <i class="fab fa-youtube card-icon"></i>
                    <h2>المحاضرات</h2>
                </a>

                <a href="#" class="neu-card books">
                    <i class="fas fa-book-open card-icon"></i>
                    <h2>المذكرات</h2>
                </a>

            </div>

        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const splash = document.getElementById('splash-container');
            const brand = document.getElementById('brand-name');
            const heart = document.getElementById('heart-anim');
            const content = document.getElementById('main-content');

            // 1. تظليل النص بالأصفر
            setTimeout(() => {
                brand.classList.add('highlighted');
            }, 600);

            // 2. إظهار ورسم القلب
            setTimeout(() => {
                heart.classList.add('show');
            }, 1200);

            // 3. الحركة الكبرى: صعود العنوان وظهور المحتوى
            setTimeout(() => {
                splash.classList.add('move-up'); // العنوان يصعد للأعلى
                content.classList.add('visible'); // المحتوى يظهر من الأسفل
            }, 3500);
        });
    </script>

</body>
</html>
